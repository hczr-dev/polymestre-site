# ------------------------------------------------------------------------------------------
# Sections
# ------------------------------------------------------------------------------------------

[today.title]
fr = "Ta page d'accueil"
en = "Your home page"

[today.text]
fr = "Ton horaire et matière par matière, ce qui t'attend ou a pris du retard."
en = "Your timetable and, course by course, what's coming up or has fallen behind."

[today.alt]
fr = "L'écran Aujourd'hui sur iPhone, avec des données d'exemple."
en = "The Today screen on iPhone, with sample data."

[semester.title]
fr = "Ton semestre se range tout seul."
en = "Your semester sorts itself out."

[semester.text]
fr = "Connecte tes comptes, et les vidéos, séries et corrigés sont automatiquement importés depuis Moodle, Botafogo ou Ed."
en = "Connect your accounts, and videos, exercise sheets and solutions are imported automatically from Moodle, Botafogo or Ed."

[semester.alt]
fr = "Tes cours sur iPhone, avec des données d'exemple."
en = "Your courses on iPhone, with sample data."

[study.title]
fr = "Un mode étude pour faire tes séries."
en = "A study mode for your exercise sheets."

[study.text]
fr = "L'exercice en plein écran avec un chrono, un tuteur IA qui te donne des indices plutôt que la réponse et corrige ta copie."
en = "The exercise full screen with a timer, and an AI tutor that gives you hints rather than the answer and corrects your work."

[study.alt]
fr = "Le mode étude sur Mac : un exercice d'Analyse I et le bilan du tuteur, avec des données d'exemple."
en = "Study mode on Mac: an Analysis I exercise and the tutor's feedback, with sample data."

[hours.title]
fr = "Un suivi de tes heures sur mesure."
en = "Study hours, tracked your way."

[hours.text]
fr = "Tu sais chaque semaine combien tu as travaillé sur chaque exercice et chaque matière."
en = "Every week you know how long you worked on each exercise and each course."

[hours.alt]
fr = "Le bilan de la semaine sur Windows, avec des données d'exemple."
en = "The week's summary on Windows, with sample data."

[groups.title]
fr = "Travailler à plusieurs."
en = "Study together."

[groups.text]
fr = "Crée un groupe avec tes amis : vous voyez qui travaille en ce moment et où chacun en est dans les séries."
en = "Create a group with your friends: you see who's working right now and how far each of you is in the exercise sheets."

[groups.alt]
fr = "L'avancement d'un groupe dans les séries, avec des données d'exemple."
en = "A group's progress through the exercise sheets, with sample data."

[everywhere.title]
fr = "Sur iPhone, Mac et Windows."
en = "On iPhone, Mac and Windows."

[everywhere.text]
fr = '''L'app synchronise tes données de manière sécurisée. Ni pub, ni traceur. <a href="privacy.html">Confidentialité</a>'''
en = '''The app syncs your data securely. No ads, no trackers. <a href="privacy.html#en">Privacy</a>'''

