# Les textes du site, en français et en anglais côte à côte.
#
# Modifier un texte : change la ligne fr = ou en = ci-dessous, puis lance
#     python3 i18n/build.py
# qui régénère index.html (français) et en.html (anglais). Le script refuse de construire
# s'il manque une traduction, et signale les textes qui ne servent plus.
#
# Chaque [section.nom] correspond à un {{section.nom}} dans i18n/index.html.
# Les textes entre ''' ... ''' peuvent contenir du HTML (liens, guillemets) tel quel.
# Une liste ["a", "b"] s'écrit a|b dans la page ; {{nom[0]}} en prend le premier élément.

# ------------------------------------------------------------------------------------------
# En-tête de la page, langue
# ------------------------------------------------------------------------------------------

[page.lang]
fr = "fr"
en = "en"

[page.locale]
fr = "fr_CH"
en = "en_GB"

# Le logo en haut à gauche ramène au début de la page dans la même langue.
[page.home]
fr = "./"
en = "en.html"

[page.title]
fr = "StudyTrack — tes cours EPFL, semaine par semaine"
en = "StudyTrack — your EPFL courses, week by week"

[page.description]
fr = "StudyTrack rassemble tes cours EPFL (Moodle, Botafogo, Ed, IS-Academia) et te dit chaque matin ce qu'il reste à faire. Mode étude, heures honnêtes, groupes. Gratuit sur iPhone, Mac et Windows."
en = "StudyTrack gathers your EPFL courses (Moodle, Botafogo, Ed, IS-Academia) and tells you every morning what's left to do. Study mode, honest hours, groups. Free on iPhone, Mac and Windows."

[page.og_description]
fr = "Tes cours EPFL au même endroit, et chaque matin ce qu'il reste à faire. iPhone, Mac et Windows."
en = "Your EPFL courses in one place, and every morning what's left to do. iPhone, Mac and Windows."

# Le lien vers l'autre langue, en haut à droite.
[switch.label]
fr = "EN"
en = "FR"

[switch.title]
fr = "English version"
en = "Version française"

[switch.lang]
fr = "en"
en = "fr"

[switch.href]
fr = "en.html"
en = "./"

